name: Publish Roblox Web Chat Archiver v2.0.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-v2.0.0.yml

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    if: github.event.head_commit.message == 'Prepare and publish Roblox Web Chat Archiver v2.0.0'
    uses: ./.github/workflows/release.yml
    with:
      release_tag: v2.0.0
      release_sha: ${{ github.sha }}
