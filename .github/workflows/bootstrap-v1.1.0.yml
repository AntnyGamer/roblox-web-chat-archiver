name: Bootstrap verified v1.1.1 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-v1.1.0.yml

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  create-tag:
    if: github.event.head_commit.message == 'Bootstrap verified v1.1.1 release'
    runs-on: ubuntu-latest
    steps:
      - name: Verify version is new and release commit exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 43e88bf7301d8ab8ee6d9e047b85db57635f28cf
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.1.1" >/dev/null 2>&1; then
            echo "v1.1.1 already has a tag; refusing to overwrite" >&2
            exit 1
          fi
          if gh release view v1.1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.1.1 already has a release; refusing to overwrite" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA" --jq '.sha' | grep -Fx "$RELEASE_SHA"
      - name: Create v1.1.1 tag at the reviewed release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 43e88bf7301d8ab8ee6d9e047b85db57635f28cf
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v1.1.1" -f sha="$RELEASE_SHA" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.1.1" --jq '.object.sha')" = "$RELEASE_SHA"

  publish:
    needs: create-tag
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: v1.1.1
