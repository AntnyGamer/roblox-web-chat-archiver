name: Publish Roblox Web Chat Archiver v2.0.0 revision 3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v2.0.0-r3.yml

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Prepare and publish Roblox Web Chat Archiver v2.0.0-r3')
    uses: ./.github/workflows/release.yml
    with:
      release_tag: v2.0.0-r3
      release_sha: ${{ github.sha }}

