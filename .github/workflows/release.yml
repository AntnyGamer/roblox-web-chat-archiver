name: Publish verified release ZIP

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  validate-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || inputs.release_tag || github.ref_name }}
          persist-credentials: false
      - name: Test Windows PowerShell archiver offline
        shell: powershell
        run: ./tests/test_archiver.ps1

  publish:
    needs: validate-powershell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || inputs.release_tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Test Python archiver offline
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test offline viewer
        run: node tests/test_viewer.js
      - name: Build exactly the six distribution files
        id: package
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          files = ("app.py", "archiver.ps1", "LICENSE", "README.md", "run_archiver.bat", "viewer.html")
          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v") or any(char in tag for char in "/\\"):
              raise ValueError("Invalid release tag")
          for file in files:
              if not Path(file).is_file():
                  raise FileNotFoundError(file)
          name = f"roblox-web-chat-archiver-{tag}.zip"
          with ZipFile(name, "w", compression=ZIP_DEFLATED, compresslevel=9) as zip_file:
              for file in files:
                  zip_file.write(file, arcname=file)
          with ZipFile(name) as zip_file:
              if zip_file.namelist() != list(files) or zip_file.testzip() is not None:
                  raise ValueError("Release ZIP contents failed verification")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={name}\n")
          print(f"Created {name} with {len(files)} files")
          PY
      - name: Attest ZIP provenance before publishing
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.path }}
      - name: Publish release with ZIP already attached (immutable-safe)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_ZIP: ${{ steps.package.outputs.path }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing $RELEASE_TAG release" >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          - Preserve conversations with missing/null IDs and any embedded message previews, without aborting the archive.
          - Continue fetching message history for conversations with valid IDs.
          - Handle null or alternate pagination cursors safely.
          - Show incomplete-history warnings in the local viewer.
          - Includes Python, PowerShell, and viewer offline tests.
          - Attached ZIP contains exactly the six application and documentation files shown in the release, with build provenance attestation.

          Note: Roblox does not expose complete message history for conversations without a server ID; those are explicitly marked incomplete.
          NOTES
          gh release create "$RELEASE_TAG" "$RELEASE_ZIP" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "Roblox Web Chat Archiver $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft')" = "false"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$RELEASE_ZIP"
