name: Publish release ZIP

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  validate-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Test Windows PowerShell archiver offline
        shell: powershell
        run: ./tests/test_archiver.ps1

  publish:
    needs: validate-powershell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Test Python archiver offline
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test offline viewer
        run: node tests/test_viewer.js
      - name: Build exactly the six distribution files
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          files = ("app.py", "archiver.ps1", "LICENSE", "README.md", "run_archiver.bat", "viewer.html")
          tag = os.environ["RELEASE_TAG"]
          if not tag or any(char in tag for char in "/\\"):
              raise ValueError("Invalid release tag")
          for file in files:
              if not Path(file).is_file():
                  raise FileNotFoundError(file)
          name = f"roblox-web-chat-archiver-{tag}.zip"
          with ZipFile(name, "w", compression=ZIP_DEFLATED, compresslevel=9) as zip_file:
              for file in files:
                  zip_file.write(file, arcname=file)
          with ZipFile(name) as zip_file:
              if zip_file.namelist() != list(files) or zip_file.testzip() is not None:
                  raise ValueError("Release ZIP contents failed verification")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={name}\n")
          print(f"Created {name} with {len(files)} files")
          PY
      - name: Attest ZIP provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.path }}
      - name: Upload ZIP asset to the published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ZIP: ${{ steps.package.outputs.path }}
        run: gh release upload "$RELEASE_TAG" "$RELEASE_ZIP" --clobber
