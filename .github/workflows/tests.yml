name: Offline archiver regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run archive tests without a Roblox account
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Windows PowerShell implementation offline
        shell: powershell
        run: ./tests/test_archiver.ps1
