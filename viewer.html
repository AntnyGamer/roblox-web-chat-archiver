<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox Chat Archive Viewer</title>
<style>
:root{color-scheme:dark;--bg:#151515;--panel:#1d1d1f;--panel2:#252529;--line:#38383d;--text:#f4f4f5;--muted:#a7a7ad;--accent:#7c5cff;--hover:#2f2f35}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}.app{height:100vh;display:grid;grid-template-columns:minmax(260px,34%) 1fr}.sidebar{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0}.top{padding:16px;border-bottom:1px solid var(--line)}.top h1{font-size:18px;margin:0 0 4px}.sub{color:var(--muted);font-size:12px}.toolbar{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}.btn{border:1px solid var(--line);background:var(--accent);color:white;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:600}.btn:hover{filter:brightness(1.08)}.search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 10px}.convos{overflow:auto;flex:1}.convo{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}.convo:hover{background:var(--hover)}.convo.active{background:#312b53}.convo-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{margin-top:4px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{display:flex;flex-direction:column;min-width:0}.chat-head{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;background:var(--panel)}.chat-title{font-weight:700}.messages{overflow:auto;flex:1;padding:8px 0}.message{padding:10px 18px;border-bottom:1px solid #26262a}.meta{display:flex;gap:8px;align-items:baseline}.name{font-weight:700}.time{font-size:11px;color:var(--muted)}.content{margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}.welcome{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.welcome-box{max-width:520px}.welcome h2{margin-top:0}.welcome p{color:var(--muted);line-height:1.5}.hidden{display:none!important}.empty{padding:20px;color:var(--muted)}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:absolute;inset:0;z-index:2}.sidebar.hide-mobile{display:none}.main{height:100vh}.chat-head{padding-left:14px}.back{display:inline-block!important;margin-right:10px}.convo{padding:14px}}.back{display:none;background:none;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
</style>
</head>
<body>
<div id="welcome" class="welcome">
  <div class="welcome-box">
    <h2>Roblox Chat Archive Viewer</h2>
    <p>This viewer runs locally in your browser. It does not upload your archive or load external scripts.</p>
    <button id="loadWelcome" class="btn">Load archive</button>
  </div>
</div>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="top"><h1 id="accountName">Archive</h1><div id="stats" class="sub"></div></div>
    <div class="toolbar"><button id="loadAgain" class="btn">Load another archive</button><input id="search" class="search" placeholder="Search conversations"></div>
    <div id="convos" class="convos"></div>
  </aside>
  <main class="main">
    <div class="chat-head"><button id="back" class="back">←</button><div id="chatTitle" class="chat-title">Select a conversation</div></div>
    <div id="messages" class="messages"><div class="empty">Choose a conversation on the left.</div></div>
  </main>
</div>
<input id="picker" type="file" accept=".json,application/json" hidden>

<script>
"use strict";
let archive = null;
let conversationEntries = [];
const $ = id => document.getElementById(id);
const picker = $("picker");

function text(v){ return v == null ? "" : String(v); }
function parseDate(v){ const d = new Date(v); return Number.isNaN(d.getTime()) ? null : d; }
function formatDate(v){ const d=parseDate(v); return d ? d.toLocaleString() : text(v); }
function personFor(id){
  if(!archive || !archive.people) return null;
  return archive.people[String(id)] || archive.people[id] || null;
}
function speakerName(id){ const p=personFor(id); return p ? (p.name || p.displayName || `User ${id}`) : (Number(id)===0 ? "Roblox" : `Unknown user ${id}`); }

function latestMessage(convo){
  const arr=Array.isArray(convo.messages)?convo.messages:[];
  if(!arr.length) return null;
  return arr.reduce((best,m)=>{
    const t=parseDate(m.sent || m.created_at || m.createdAt || m.timestamp);
    const bt=best && parseDate(best.sent || best.created_at || best.createdAt || best.timestamp);
    if(!best) return m;
    if(t && (!bt || t>bt)) return m;
    return best;
  },null);
}

function renderConversationList(filter=""){
  const root=$("convos"); root.textContent="";
  const q=filter.trim().toLowerCase();
  let shown=0;
  for(const [id,convo] of conversationEntries){
    const title=text(convo.title || convo.name || `Conversation ${id}`);
    const last=latestMessage(convo);
    const preview=last ? `${speakerName(last.senderTargetId ?? last.sender_user_id ?? last.senderUserId ?? 0)}: ${text(last.content ?? last.text ?? last.message)}` : "No messages";
    if(q && !(title.toLowerCase().includes(q) || preview.toLowerCase().includes(q))) continue;
    shown++;
    const el=document.createElement("div"); el.className="convo"; el.dataset.id=id;
    const t=document.createElement("div"); t.className="convo-title"; t.textContent=title;
    const p=document.createElement("div"); p.className="preview"; p.textContent=preview;
    el.append(t,p); el.addEventListener("click",()=>openConversation(id,el)); root.append(el);
  }
  if(!shown){ const e=document.createElement("div"); e.className="empty"; e.textContent="No matching conversations."; root.append(e); }
}

function openConversation(id, el){
  document.querySelectorAll(".convo.active").forEach(x=>x.classList.remove("active"));
  if(el) el.classList.add("active");
  const convo=(archive.conversations||{})[id]; if(!convo) return;
  $("chatTitle").textContent=text(convo.title || convo.name || `Conversation ${id}`);
  const root=$("messages"); root.textContent="";
  const msgs=Array.isArray(convo.messages)?[...convo.messages]:[];
  msgs.sort((a,b)=>{
    const ta=parseDate(a.sent || a.created_at || a.createdAt || a.timestamp)?.getTime() ?? 0;
    const tb=parseDate(b.sent || b.created_at || b.createdAt || b.timestamp)?.getTime() ?? 0;
    return ta-tb;
  });
  if(!msgs.length){ const e=document.createElement("div");e.className="empty";e.textContent="No messages in this conversation.";root.append(e);return; }
  for(const m of msgs){
    const wrap=document.createElement("div"); wrap.className="message";
    const meta=document.createElement("div"); meta.className="meta";
    const name=document.createElement("span"); name.className="name"; name.textContent=speakerName(m.senderTargetId ?? m.sender_user_id ?? m.senderUserId ?? 0);
    const time=document.createElement("span"); time.className="time"; time.textContent=formatDate(m.sent || m.created_at || m.createdAt || m.timestamp);
    const content=document.createElement("div"); content.className="content"; content.textContent=text(m.content ?? m.text ?? m.message);
    meta.append(name,time); wrap.append(meta,content); root.append(wrap);
  }
  root.scrollTop=root.scrollHeight;
  if(window.innerWidth<=760) $("sidebar").classList.add("hide-mobile");
}

function loadArchive(file){
  const reader=new FileReader();
  reader.onerror=()=>alert("Could not read that file.");
  reader.onload=()=>{
    try{
      archive=JSON.parse(reader.result);
      if(!archive || typeof archive!=="object" || !archive.conversations || !archive.people) throw new Error("Missing conversations/people data");
      conversationEntries=Object.entries(archive.conversations);
      conversationEntries.sort((a,b)=>{
        const am=latestMessage(a[1]); const bm=latestMessage(b[1]);
        const at=parseDate(am?.sent || am?.created_at || am?.createdAt || am?.timestamp)?.getTime() ?? 0;
        const bt=parseDate(bm?.sent || bm?.created_at || bm?.createdAt || bm?.timestamp)?.getTime() ?? 0;
        return bt-at;
      });
      const me=personFor(archive.userId);
      $("accountName").textContent=me ? (me.name || me.displayName || `User ${archive.userId}`) : `User ${archive.userId ?? "?"}`;
      const msgCount=conversationEntries.reduce((n,[,c])=>n+(Array.isArray(c.messages)?c.messages.length:0),0);
      $("stats").textContent=`${conversationEntries.length.toLocaleString()} conversations • ${msgCount.toLocaleString()} messages`;
      $("welcome").classList.add("hidden"); $("app").classList.remove("hidden"); $("sidebar").classList.remove("hide-mobile");
      $("chatTitle").textContent="Select a conversation"; $("messages").innerHTML='<div class="empty">Choose a conversation on the left.</div>';
      $("search").value=""; renderConversationList();
    }catch(err){ alert(`That does not look like a valid Roblox chat archive.\n\n${err.message}`); }
  };
  reader.readAsText(file,"UTF-8");
}

function choose(){ picker.value=""; picker.click(); }
$("loadWelcome").addEventListener("click",choose); $("loadAgain").addEventListener("click",choose);
picker.addEventListener("change",e=>{ if(e.target.files && e.target.files[0]) loadArchive(e.target.files[0]); });
$("search").addEventListener("input",e=>renderConversationList(e.target.value));
$("back").addEventListener("click",()=>$("sidebar").classList.remove("hide-mobile"));
</script>
</body>
</html>
